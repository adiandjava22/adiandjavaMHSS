spring.application.name=mentalhealth.app

# Server Configuration
server.port=8080

# MySQL Database Configuration (Aiven Cloud)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://host:port/defaultdb?ssl-mode=REQUIRED}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Groq AI / Spring AI Configuration
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=openai/gpt-oss-20b
spring.ai.openai.chat.options.temperature=0.7
spring.ai.retry.max-attempts=1

# Mail Configuration (Secured)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=tanmayranotkar2005@gmail.com
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Free Phone Call API Configuration
inout.api.key=${INOUT_API_KEY:YOUR_ACTUAL_API_KEY_HERE}